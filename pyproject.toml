[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ember-bio-agents"
version = "0.1.9"
description = "LangGraph agents and orchestration for Ember Bio"
requires-python = ">=3.11"
dependencies = [
    "ember-bio-shared>=0.1.0",
    "ember-bio-data>=0.1.0",
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
semantic = [
    "chromadb>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "chromadb>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ember_agents"]

[tool.uv.sources]
ember-bio-shared = { path = "../ember-shared", editable = true }
ember-bio-data = { path = "../ember-data", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "contract: Tier 1 contract tests using recorded fixtures (no network access required)",
    "integration: Tier 2 integration tests with reference queries (mocked pipeline, no network required)",
    "benchmark: Tier 3 scoring benchmarks asserting known-relevant candidates appear in expected rank ranges (soft-gated)",
]
